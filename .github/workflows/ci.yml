name: CI

# Fast feedback on every PR into dev or main: lint, vet, unit test, and
# build both apps. Integration tests (real Postgres via testcontainers,
# see backend/Makefile's test-integration target) are intentionally not
# run here — they need Docker-in-Docker and are slower; run them
# locally or wire up a separate job later if that becomes a problem.
#
# DISABLED (2026-09-23): automatic runs turned off — this no longer
# triggers on PRs. Still runnable by hand from the Actions tab
# ("Run workflow"). To restore automatic runs, delete the
# `workflow_dispatch:` line below and uncomment the `pull_request` block.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # No separate `go vet` step: backend/.golangci.yml already enables
      # the govet linter, so golangci-lint below covers it — a
      # standalone `go vet ./...` here would just redo the same
      # analysis a second time on every run.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          # v1.64.8 is the last v1-config-compatible release (v2 requires
          # migrating .golangci.yml's format, a separate, larger change).
          # But its prebuilt release binary was compiled with Go 1.24, and
          # golangci-lint refuses to run when the Go it was built with is
          # older than go.mod's target ("the Go language version (go1.24)
          # used to build golangci-lint is lower than the targeted Go
          # version (1.25.11)"). goinstall builds it from source with the
          # runner's Go (set up above from go.mod), which sidesteps that.
          version: v1.64.8
          install-mode: goinstall

      - name: go test
        run: go test ./... -race -count=1

      - name: go build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck + build
        run: npm run build
